<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Inkly</title><link rel="stylesheet" href="css/style.css"></head>
<body data-page="dashboard">
<div id="toast" class="toast"></div>
<header class="navbar"><a class="brand" href="index.html"><span class="brand-mark">I</span> Inkly</a><button class="menu-toggle" id="menuToggle">☰</button><nav id="mainNav"><a href="index.html">Home</a><a class="active" href="dashboard.html">Dashboard</a><a class="nav-cta" href="create-post.html">+ New story</a><button class="link-button" data-action="logout">Logout</button></nav></header>
<main class="dashboard section">
  <div class="dashboard-top"><div><span class="eyebrow">YOUR WORKSPACE</span><h1>Good to see you, <span id="dashName">writer</span>.</h1><p class="muted">Manage your stories and keep building your publishing habit.</p></div><a class="btn btn-primary" href="create-post.html">+ Create post</a></div>

  <div id="myPosts" class="post-list"></div>
