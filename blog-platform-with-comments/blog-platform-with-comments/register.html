<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account — Inkly</title><link rel="stylesheet" href="css/style.css"></head>
<body data-page="register">
<div id="toast" class="toast"></div>
<header class="navbar"><a class="brand" href="index.html"><span class="brand-mark">I</span> Inkly</a><nav><a href="index.html">Home</a><a href="login.html">Sign in</a></nav></header>
<main class="auth-shell"><section class="auth-card"><div class="auth-intro"><span class="eyebrow">JOIN THE COMMUNITY</span><h1>Your ideas<br><em>belong here.</em></h1><p>Create a free demo account and start publishing your own stories.</p><div class="feature-list"><span>✓ Publish and edit posts</span><span>✓ Comment on stories</span><span>✓ Your data stays in your browser</span></div></div>
<form id="registerForm" class="form-card"><h2>Create account</h2><p class="muted">It only takes a moment.</p><label>Full name<input id="registerName" type="text" required maxlength="60"></label><label>Email<input id="registerEmail" type="email" required></label><label>Password<input id="registerPassword" type="password" minlength="6" required></label><button class="btn btn-primary full" type="submit">Create account <span>→</span></button><p class="form-foot">Already registered? <a href="login.html">Sign in</a></p></form></section></main>
<script src="js/app.js"></script><script src="js/auth.js"></script></body></html>
